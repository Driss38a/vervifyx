name: Build Android AAB and APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate temporary keystore and print Base64
        run: |
          keytool -genkeypair -v -keystore upload-keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias upload \
            -storepass "CANADAcasa@80!" \
            -keypass "CANADAcasa@80!" \
            -dname "CN=Driss, OU=VervifyX, O=VervifyX, L=Casablanca, S=Casablanca-Settat, C=MA"
          base64 -w 0 upload-keystore.jks > keystore.b64
          echo "=== START BASE64 ==="
          cat keystore.b64
          echo ""
          echo "=== END BASE64 ==="

      - name: Clean and Install Dependencies
        run: |
          cd apps/mobile
          flutter clean
          flutter pub get

      - name: Build Android AAB
        run: |
          cd apps/mobile
          flutter build appbundle --release

      - name: Build Android APK
        run: |
          cd apps/mobile
          flutter build apk --release

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vervifyx-app-bundle-release
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vervifyx-app-release
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
